<!DOCTYPE html>
<html lang="id">
<head>

<title>Binary Challenge – Petualangan Bilangan Biner</title>

<style>

* {

}
html,
body {

}
:root {

}
h2 {

.c {

<body>
<div id="bg" aria-hidden="true"></div>
<div class="wrap">
 <div id="hud" class="card hide" style="margin-top:0">
  <div class="hud"><span id="hN"></span><span id="hL">Level 1</span><span id="hS">⭐ 0</span><span id="hH">❤️❤️❤️</span><button class="btn g" id="snd" style="padding:6px 12px" onclick="toggleSnd()">🔊</button></div>
  <div class="bar"><i id="pg"></i></div>
 </div>
 <main id="app"></main>
</div>
<script>
/* ===== Utilitas ===== */

const $ = id => document.getElementById(id), rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const bin = n => n.toString(2), shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
let sndOn = true, AC;
function beep(seq) {
  if (!sndOn) return;
  try {
    AC = AC || new(window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = f;
      o.type = 'triangle';
      g.gain.setValueAtTime(.15, t);
      g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g);
      g.connect(AC.destination);
      o.start(t);
      o.stop(t + d);
      t += d
    })
  }
  catch (e) {

  }

}
const SND = {
  ok: [[660, .1], [880, .15]],
  no: [[220, .2], [160, .25]],
  lvl: [[523, .1], [659, .1], [784, .1], [1047, .25]],
  end: [[523, .12], [659, .12], [784, .12], [1047, .12], [784, .12], [1047, .3]]
};

function toggleSnd() {
  sndOn = !sndOn;
  $('snd').textContent = sndOn ? '🔊': '🔇'
}
/* ===== Pembahasan penjumlahan biner (kolom demi kolom) ===== */

function explainAdd(a, b) {
  const x = bin(a), y = bin(b), n = Math.max(x.length, y.length), p = x.padStart(n, '0'), q = y.padStart(n, '0');
  let c = 0, L = [];
  for (let i = n - 1; i >= 0; i--) {
    const s = +p[i]+ +q[i] + c;
    L.push(`Kolom ${n-i}: ${p[i]} + ${q[i]}${c?' + carry 1':''} = ${bin(s)} → tulis ${s%2}${s>1?', carry 1':''}`);
    c = s > 1 ? 1: 0
  }
  if (c) L.push('Carry terakhir 1 ditulis di paling kiri.');
  return L.join('\n')+`\nHasil: ${bin(a+b)}`;

}
function pad(x, y, op = '+') {
  const n = Math.max(x.length, y.length) + 1;
  return `${' '.repeat(n-x.length)}${x}\n${op}${' '.repeat(n-y.length-1)}${y}\n${'-'.repeat(n)}`
}
/* ===== Generator soal (tambah tipe baru di sini) ===== */

const GEN = {
  color(n) {
    let d;
    do {
      d = Array.from( {
        length: n
      },
      () => rnd(0, 1)).join('')
    }
    while (!d.includes('0') || !d.includes('1'));
    return {
      kind: 'color',
      d,
      ans: d,
      exp: ''
    }

  },

  choices() {
    const colorName = bit => bit === '0' ? 'hitam' : 'putih';
    const colorLabel = bits => `Urutan warna: ${[...bits].map(colorName).join(', ')}.`;
    const binaryLabel = bits => `Urutan angka: ${[...bits].join(', ')}.`;
    const changeOneBit = bits => {
      const index = bits.indexOf('0');
      return bits.slice(0, index) + '1' + bits.slice(index + 1)
    };
    const sequenceQuestions = [
      { bits: '010', direction: 'to-color' },
      { bits: '101', direction: 'to-color' },
      { bits: '1100', direction: 'to-color' },
      { bits: '0101', direction: 'to-binary' },
      { bits: '100', direction: 'to-binary' }
    ].map(({ bits, direction }) => {
      const wrong = changeOneBit(bits);
      const toColor = direction === 'to-color';
      const optionValues = shuffle([bits, wrong]);
      return {
        kind: 'choice',
        prompt: toColor
          ? 'Pilih urutan kotak yang cocok dengan angka-angka ini.'
          : 'Pilih urutan angka yang cocok dengan warna kotak ini.',
        visual: {
          kind: toColor ? 'binary-sequence' : 'color-sequence',
          value: bits,
          label: toColor ? binaryLabel(bits) : colorLabel(bits)
        },
        options: optionValues.map(value => ({
          value,
          kind: 'sequence',
          display: toColor ? 'color' : 'binary',
          label: toColor ? colorLabel(value) : binaryLabel(value)
        })),
        ans: bits,
        exp: `Ingat: 0 = hitam dan 1 = putih. ${binaryLabel(bits)} ${colorLabel(bits)}`
      }
    });
    const targetValues = shuffle([1, 2, 3, 4, 5, 6, 7]).slice(0, 5);
    const mediumQuestions = targetValues.map(n => {
      const bits = n.toString(2).padStart(3, '0');
      const activePlaces = [4, 2, 1].filter((place, index) => bits[index] === '1');
      return {
        kind: 'easy-bits',
        n,
        ans: bits,
        prompt: `Nyalakan kotak bernilai 4, 2, atau 1 sampai jumlahnya menjadi ${n}.`,
        exp: `Kotak yang menyala bernilai ${activePlaces.join(' dan ')}. ${activePlaces.join(' + ')} = ${n}.`
      }
    });
    const valueQuestions = shuffle([1, 2, 3, 4, 5, 6, 7]).slice(0, 5).map(n => {
      const bits = n.toString(2).padStart(3, '0');
      const places = [4, 2, 1];
      const parts = [...bits].map((bit, index) => bit === '1' ? places[index] : 0);
      const other = n === 7 ? n - 1 : n + 1;
      return {
        kind: 'choice',
        prompt: 'Berapa nilai urutan ini? Nilai kotaknya dari kiri: 4, 2, 1.',
        visual: { kind: 'binary-sequence', value: bits, label: binaryLabel(bits) },
        options: shuffle([String(n), String(other)]).map(value => ({
          value,
          kind: 'number',
          label: value
        })),
        ans: String(n),
        exp: `${binaryLabel(bits)} ${parts.join(' + ')} = ${n}.`
      }
    });

    return [...shuffle(sequenceQuestions), ...shuffle(mediumQuestions), ...valueQuestions]
  },

 bits(lo, hi) {
    const n = rnd(lo, hi), pv = [128, 64, 32, 16, 8, 4, 2, 1], parts = [];
    let m = n;
    pv.forEach(v => {
      if (m >= v) {
        parts.push(v);
        m -= v
      }

    });
    return {
      kind: 'bits',
      n,
      ans: n.toString(2).padStart(8, '0'),
      exp: `${n} = ${parts.join(' + ')}`
    }

  },

 add(bits) {
    const a = rnd(1, 2 ** bits - 1), b = rnd(1, 2 ** bits - 1);
    return {
      kind: 'bin',
      html: `<pre>${pad(bin(a),bin(b))}</pre><div>Hasil (biner) = ?</div>`,
      ans: bin(a + b),
      exp: explainAdd(a, b)
    }

  },

 three() {
    const a = rnd(1, 7), b = rnd(1, 7), c = rnd(1, 7);
    return {
      kind: 'bin',
      html: `<div class="mono" style="font-size:1.4rem">${bin(a)} + ${bin(b)} + ${bin(c)} = ?</div>`,
      ans: bin(a + b + c),
      exp: `Jumlahkan dua bilangan dulu, lalu tambahkan yang ketiga.\nPengecekan: ${a} + ${b} + ${c} = ${a+b+c} = ${bin(a+b+c)} (biner).`
    }

  },

 missing() {
    const a = rnd(3, 10), c = a + rnd(2, 8);
    return {
      kind: 'bin',
      html: `<div class="mono" style="font-size:1.5rem">${bin(a)} + ? = ${bin(c)}</div><div>Bilangan yang hilang (biner)?</div>`,
      ans: bin(c - a),
      exp: `Cari ? dengan pengurangan: ${bin(c)} − ${bin(a)}.\nPengecekan: ${c} − ${a} = ${c-a} = ${bin(c-a)}.`
    }

  },

 puzzle() {
    const n = rnd(4, 14);
    return {
      kind: 'bin',
      html: `<div>🧩 Aku sebuah bilangan biner. Jika aku ditambah <b class="mono">1</b>, hasilnya <b class="mono">${bin(n+1)}</b>. Siapakah aku?</div>`,
      ans: bin(n),
      exp: `Kurangi hasilnya dengan 1: ${bin(n+1)} − 1 = ${bin(n)}.`
    }

  },

 d2b(lo = 9, hi = 31) {
    const n = rnd(lo, hi), parts = [];
    let m = n;
    [16, 8, 4, 2, 1].forEach(v => {
      if (m >= v) {
        parts.push(v);
        m -= v
      }

    });
    return {
      kind: 'bin',
      html: `<div class="mu">Ubah ke biner</div><div class="mono" style="font-size:2.6rem">${n}</div>`,
      ans: bin(n),
      exp: `${n} = ${parts.join(' + ')}\nTulis 1 pada nilai tempat itu dan 0 pada sisanya: ${bin(n)}`
    }

  },

 b2d(lo = 9, hi = 31) {
    const n = rnd(lo, hi), s = bin(n), t = [...s].map((c, i) => c === '1' ? 2 ** (s.length - 1 - i): null).filter(v => v !== null);
    return {
      kind: 'dec',
      html: `<div class="mu">Ubah ke desimal</div><div class="mono" style="font-size:2.6rem">${s}</div>`,
      ans: String(n),
      exp: `Jumlahkan nilai tempat yang bernilai 1: ${t.join(' + ')} = ${n}`
    }

  }

};

      b.classList.toggle('on', cur[i] === '1')
    })
  }
  const inp = $('ai');
  if (inp) {
    inp.focus();
    inp.onkeydown = e => {
      if (e.key === 'Enter') submitAns()
    }

  }
  if (L.time) {
    const end = Date.now() + L.time * 1000;
    timer = setInterval(() => {
      const r = end - Date.now();
      $('tb').style.width = Math.max(0, r / (L.time * 10))+'%';
      if (r <= 0) {
        clearInterval(timer);
        ans(null)
      }

    },
    100)
  }

}
function checkColor() {
  if (cur.includes(null)) {
    $('er').textContent = 'Warnai semua kotak dulu ya!';
    return
  }
  ans(cur.join(''))
}
function submitAns() {
  const q = S.qs[S.i], v = $('ai').value.trim(), re = q.kind === 'bin' ? /^[01]+$/: /^\d+$/;
  if (!re.test(v)) {
    $('er').textContent = q.kind === 'bin' ? 'Hanya boleh angka 0 dan 1!': 'Isi dengan angka saja!';
    return
  }
  ans(q.kind === 'bin' ? v.replace(/^0+(?=.)/, ''): String(+v))
}
function ans(v) {
  clearInterval(timer);
  const L = LEVELS[S.l], q = S.qs[S.i], good = v === q.ans;
  const card = app.firstChild;
  if (S.mode !== 'easy') card.classList.add(good ? 'bounce': 'shake');
  if (good) {
    S.score[S.l] += L.pts;
    S.ok[S.l]++;
    beep(SND.ok)
  }
  else {
    S.bad[S.l]++;
    if (S.mode !== 'easy') {
      S.lives--;
      beep(SND.no)
    }
  }
  let head, txt = q.exp;
  if (q.kind === 'choice') {
    document.querySelectorAll('.easy-choice').forEach(b => {
      if (b.dataset.value === q.ans) b.classList.add('correct');
      else if (b.dataset.value === v) b.classList.add('selected-wrong')
    });
    head = good ? 'Tepat! Kamu hebat.' : 'Belum cocok. Tidak apa-apa, kita belajar bersama.'
  }
  else if (q.kind === 'easy-bits') {
    document.querySelectorAll('.easy-bit-toggle').forEach((b, i) => {
      const answer = q.ans[i];
      b.textContent = answer;
      b.classList.toggle('is-one', answer === '1');
      b.style.borderColor = cur[i] === answer ? 'var(--ok)' : 'var(--no)';
      b.setAttribute('aria-pressed', String(answer === '1'));
      b.setAttribute('aria-label', `Nilai tempat ${b.dataset.place}, angka ${answer}, ${answer === '1' ? 'menyala' : 'mati'}`)
    });
    head = good ? 'Tepat! Kotak-kotaknya sudah sesuai.' : 'Belum cocok. Kita lihat susunan yang benar bersama.'
  }
  else if (q.kind === 'color') {
    document.querySelectorAll('.sq').forEach((b, i) => {
      const t = q.d[i];
      b.className = 'sq '+(t === '1' ? 'w': 'k');
      b.style.borderColor = cur[i] === t ? 'var(--ok)': 'var(--no)';
      b.style.borderWidth = '4px'
    });
    head = good ? 'Benar! 0 direpresentasikan dengan warna hitam dan 1 dengan warna putih.': 'Belum tepat. Ingat: 0 = hitam dan 1 = putih.';
    txt = good ? '': 'Kotak berbingkai merah adalah yang belum tepat. Warna yang benar sudah ditampilkan.'
  }
  else if (q.kind === 'bits') {
    document.querySelectorAll('.bt').forEach((b, i) => {
      const t = q.ans[i];
      b.textContent = t;
      b.classList.toggle('on', t === '1');
      b.style.borderColor = cur[i] === t ? 'var(--ok)': 'var(--no)'
    });
    head = good ? 'Benar!': (v === null ? '⏰ Waktu habis! ': '')+`Jawaban yang benar: ${q.ans}`
  }
  else if (good) head = 'Benar! Kerja bagus!';
  else head = (v === null ? '⏰ Waktu habis! ': '')+`Jawaban yang benar: ${q.ans}`;
  const over = S.mode !== 'easy' && S.lives <= 0, last = S.i === S.qs.length - 1;
  document.querySelectorAll('.card button.btn,.card input,.sq,.bt,.easy-choice,.easy-bit-toggle').forEach(e => {
    if (!e.classList.contains('g')) e.disabled = true
  });
  const feedbackClass = good ? 'ok' : S.mode === 'easy' ? 'learn' : 'no';
  const feedbackIcon = good ? '✅ ' : S.mode === 'easy' ? '💡 ' : '❌ ';
  const actionLabel = over ? 'Lanjut' : last ? S.mode === 'easy' ? 'Lihat Rekap Nilai' : 'Selesai Level' : 'Soal Berikutnya';
  $('fb').innerHTML = `<div class="fb ${feedbackClass}"><b>${feedbackIcon}${head}</b>${txt?`<div class="t">${txt}</div>`:''}</div><div class="c" style="margin-top:8px"><button class="btn" onclick="${over?'gameOver()':'next()'}">${actionLabel}</button></div>`;
  hud();

}
function next() {
  S.i++;
  if (S.i >= S.qs.length) return S.mode === 'easy' ? final() : levelDone();
  question()
}
function levelDone() {
  clearInterval(timer);
  const L = LEVELS[S.l];
  if (S.bad[S.l] === 0) {
    S.bonus[S.l] = 50;
    S.score[S.l] += 50
  }
  hud();
  const last = S.l === 2;
  beep(last ? SND.end: SND.lvl);
  app.innerHTML = `<div class="card c"><div style="font-size:3rem">🎉</div><h2>Level berhasil diselesaikan!</h2><p>Skor Level ${S.l+1}: <b>${S.score[S.l]}</b></p>${S.bonus[S.l]?'<p class="mu">Bonus tanpa kesalahan +50 🌟</p>':''}<button class="btn" onclick="after()">${last?'Lihat Hasil Akhir':'Buka Level Berikutnya'}</button></div>`
}
function after() {
  if (S.l === 2) return final();
  S.l++;
  S.unlocked = Math.max(S.unlocked, S.l);
  intro()
}
function gameOver() {
  clearInterval(timer);
  beep(SND.no);
  saveResult();
  const score = S.score.reduce((a, b) => a + b, 0), correct = S.ok.reduce((a, b) => a + b, 0), answered = correct + S.bad.reduce((a, b) => a + b, 0), accuracy = answered ? Math.round(correct / answered * 100) : 0;
  app.innerHTML = `<div class="card c"><div style="font-size:3rem">💔</div><h2>Game selesai untuk saat ini</h2><p>Kita bisa mencoba lagi kapan saja.</p><p>Nama pemain: <b>${escapeHTML(S.name)}</b></p><table class="res" style="text-align:left"><tr><td><b>Skor</b></td><td><b>${score}</b></td></tr><tr><td>Akurasi</td><td>${accuracy}%</td></tr></table><button class="btn" onclick="retry()">Coba Level Ini Lagi</button><button class="btn g" onclick="showRecap()">📊 Rekap Nilai</button><button class="btn g" onclick="modal('<h2>📖 Materi</h2>'+MATERI)">Pelajari Materi</button><button class="btn g" onclick="home()">Keluar</button></div>`
}
function retry() {
  S.t0 = S.t0 || Date.now();
  S.saved = false;
  startLevel()
}
function final() {
  saveResult();
  const score = S.score.reduce((a, b) => a + b, 0), correct = S.ok.reduce((a, b) => a + b, 0), answered = correct + S.bad.reduce((a, b) => a + b, 0), accuracy = answered ? Math.round(correct / answered * 100) : 0;
  hud();
  beep(SND.end);
  app.innerHTML = `<div class="card c"><div style="font-size:3rem">🏆</div><h2>Rekap Nilai</h2><p>Nama pemain: <b>${escapeHTML(S.name)}</b></p>
 <table class="res" style="text-align:left"><tr><td><b>Skor</b></td><td><b>${score}</b></td></tr><tr><td>Akurasi</td><td>${accuracy}%</td></tr></table>
 <button class="btn" onclick="home()">Main Lagi</button><button class="btn g" onclick="showRecap()">📊 Semua Rekap Nilai</button><button class="btn g" onclick="modal('<h2>📖 Materi</h2>'+MATERI)">Pelajari Materi</button></div>`
}
(function() {
  const T = ['0', '1', '0', '1', '01', '10', '0101', '1010', '1101', '0011', '</>', '{ }', '1+1'], C = ['#ff4fa3', '#ff9f1a', '#12c4a0', '#7c5cff', '#2b9cf5', '#7bc61a', '#f43f5e', '#ffc400'], b = $('bg');
  for (let i = 0; i < 48; i++) {
    const e = document.createElement('span');
    e.textContent = T[rnd(0, T.length - 1)];
    e.style.cssText = `left:${rnd(-2,96)}%;top:${rnd(-2,96)}%;font-size:${rnd(18,46)}px;color:${C[rnd(0,C.length-1)]};--r:${rnd(-25,25)}deg;animation-delay:-${rnd(0,70)/10}s;animation-duration:${rnd(60,110)/10}s`;
    b.appendChild(e)
  }

}
)();
home();
</script>
</body>
</html>
